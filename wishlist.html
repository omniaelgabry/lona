<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist | Luna Accessories</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            luxury: {
              beige: "#F5F5DC",
              gold: "#D4AF37",
              black: "#121212",
              white: "#FFFFFF",
              gray: "#E5E7EB",
              darkGray: "#374151"
            }
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            serif: ["Playfair Display", "serif"],
          },
          boxShadow: {
            "luxury": "0 4px 20px rgba(0, 0, 0, 0.05)",
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer base {
      body { @apply font-sans bg-luxury-white text-luxury-black transition-colors duration-300; }
      .dark body { @apply bg-luxury-black text-luxury-white; }
    }
    @layer components {
      .btn-primary { @apply bg-luxury-black text-luxury-white px-6 py-3 rounded hover:bg-luxury-darkGray transition-colors; }
      .dark .btn-primary { @apply bg-luxury-white text-luxury-black hover:bg-luxury-gray; }
      .btn-outline { @apply border border-luxury-black text-luxury-black px-6 py-3 rounded hover:bg-luxury-black hover:text-luxury-white transition-colors; }
      .dark .btn-outline { @apply border-luxury-white text-luxury-white hover:bg-luxury-white hover:text-luxury-black; }
      .card { @apply bg-luxury-white rounded-xl shadow-luxury overflow-hidden transition-transform hover:-translate-y-1; }
      .dark .card { @apply bg-luxury-darkGray shadow-none; }
    }
  </style>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body class="font-sans antialiased text-luxury-black bg-luxury-white dark:bg-luxury-black dark:text-luxury-white transition-colors duration-300 flex flex-col min-h-screen">
  
  <div id="app-header"></div>

  <main class="flex-grow pt-32 px-4 max-w-7xl mx-auto w-full pb-24">
    <div class="text-center mb-12">
      <h1 class="font-serif text-4xl font-bold mb-4">Your Wishlist</h1>
      <div class="w-16 h-1 bg-luxury-gold mx-auto"></div>
    </div>
    
    <div id="wishlist-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
      <!-- JS will populate -->
    </div>
  </main>

  <div id="app-footer"></div>

  <script type="module" src="./src/main.js"></script>
  <script>
    
    document.addEventListener('DOMContentLoaded', async () => {
      setupSharedUI();
      const products = await fetchProducts();
      renderWishlist(products);

      window.addCartItem = (id) => addToCart(id, 1);
      window.removeWishlistItem = (id) => {
        toggleWishlist(id);
        renderWishlist(products);
      };
    });

    function renderWishlist(products) {
      const grid = document.getElementById('wishlist-grid');
      
      if (store.wishlist.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-12"><p class="text-luxury-gray mb-6">Your wishlist is currently empty.</p><a href="shop.html" class="btn-primary">Discover Favorites</a></div>';
        grid.className = "block"; // override grid layout for empty state
        return;
      }
      
      grid.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8";
      let html = '';
      
      store.wishlist.forEach(id => {
        const product = products.find(p => p.id === id);
        if (product) {
          html += `
            <div class="card group relative flex flex-col h-full">
              <div class="relative h-80 overflow-hidden">
                <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                <button onclick="window.removeWishlistItem('${product.id}')" class="absolute top-4 right-4 w-10 h-10 bg-white/80 dark:bg-black/50 rounded-full flex items-center justify-center hover:bg-red-500 hover:text-white transition-colors text-red-500">
                  <svg class="w-5 h-5 fill-current" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                </button>
                <div class="absolute inset-x-0 bottom-0 p-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                  <button onclick="window.addCartItem('${product.id}')" class="w-full bg-luxury-black text-white dark:bg-luxury-white dark:text-luxury-black py-3 font-semibold uppercase tracking-wider text-sm hover:bg-luxury-gold transition-colors relative z-20">Add to Cart</button>
                </div>
                <a href="product.html?id=${product.id}" class="absolute inset-0 z-0"></a>
              </div>
              <div class="p-6">
                <p class="text-luxury-gray text-sm mb-1 uppercase tracking-widest">${product.category}</p>
                <h3 class="font-serif text-lg font-bold"><a href="product.html?id=${product.id}">${product.name}</a></h3>
                <p class="font-bold text-lg mt-2">EGP ${product.price.toFixed(2)}</p>
              </div>
            </div>
          `;
        }
      });
      grid.innerHTML = html;
    }
  </script>
</body>
</html>
